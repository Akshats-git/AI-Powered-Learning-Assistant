# `docker compose up --build` runs the whole app: Mongo, the API, the built
# frontend served by nginx, and a complete Beckn subnet (registry, gateway and
# two provider nodes) for the Network page to search. No Redis/worker service — this app has no
# async job queue yet (BullMQ + a separate worker process is Phase 26 on the
# roadmap); everything here reflects what's actually implemented today.
#
# Set OPENAI_API_KEY in a .env file next to this one (or export it before
# running) to exercise the AI features; everything else works without it.

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/ai-learning-assistant
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-dev-only-change-me}
      CLIENT_URL: http://localhost:5173
      # Used as a shared fallback for any user who hasn't saved their own
      # OpenAI key on their Profile page — see backend/.env.example. Leave
      # unset to run bring-your-own-key only.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      MONTHLY_AI_BUDGET_USD: ${MONTHLY_AI_BUDGET_USD:-}
      # The API is the subnet's consumer node. These make the Network page
      # live against the registry, gateway and provider nodes below; drop
      # them and the page reports itself unconfigured, everything else works.
      BECKN_SUBSCRIBER_ID: app.learn.local
      BECKN_PRIVATE_KEY: ${BECKN_PRIVATE_KEY:-}
      BECKN_CALLBACK_URL: http://api:8000/beckn
      BECKN_REGISTRY_URL: http://beckn-registry:9000
      BECKN_GATEWAY_ID: gateway.learn.local
      BECKN_GATEWAY_URL: http://beckn-gateway:9001
    volumes:
      # Uploaded PDFs survive a `docker compose restart`, unlike the
      # "wiped on every deploy" problem the README flags for Render/Railway —
      # this is still local disk, not S3/R2 (Phase 26), just a persistent one.
      - uploads-data:/app/uploads

  # --- Beckn subnet ------------------------------------------------------
  # A registry, a broadcast gateway and two provider nodes, each its own
  # process, all from the backend image. `node beckn/serve.js <role>` picks
  # which one a container runs. Together with the API (the consumer node)
  # this is a complete, self-contained Beckn network on one host.

  beckn-registry:
    build:
      context: ./backend
    restart: unless-stopped
    command: node beckn/serve.js registry
    environment:
      PORT: 9000
    ports:
      - "9000:9000"

  beckn-gateway:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      - beckn-registry
    command: node beckn/serve.js gateway
    environment:
      PORT: 9001
      BECKN_SUBSCRIBER_ID: gateway.learn.local
      BECKN_PUBLIC_URL: http://beckn-gateway:9001
      BECKN_REGISTRY_URL: http://beckn-registry:9000

  beckn-provider-a:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      - beckn-registry
    command: node beckn/serve.js provider
    environment:
      PORT: 9002
      BECKN_SUBSCRIBER_ID: provider-a.learn.local
      BECKN_PUBLIC_URL: http://beckn-provider-a:9002
      BECKN_REGISTRY_URL: http://beckn-registry:9000

  beckn-provider-b:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      - beckn-registry
    command: node beckn/serve.js provider
    environment:
      PORT: 9003
      BECKN_SUBSCRIBER_ID: provider-b.learn.local
      BECKN_PUBLIC_URL: http://beckn-provider-b:9003
      BECKN_REGISTRY_URL: http://beckn-registry:9000

  web:
    build:
      context: ./frontend/ai-learning-assistant
      args:
        # Baked into the JS bundle at build time — the *browser* has to be
        # able to resolve this, so it's the host-mapped port below, not the
        # Docker-internal service name "api".
        VITE_API_BASE_URL: http://localhost:8000
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:8080"

volumes:
  mongo-data:
  uploads-data:
