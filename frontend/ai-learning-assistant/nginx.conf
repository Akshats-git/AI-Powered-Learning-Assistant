server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip the text-based assets Vite emits; images/fonts are already compressed.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Long-cache the hashed, content-addressed build assets...
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ...but never cache index.html itself, or a deploy can leave a browser
    # stuck referencing assets that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: any path that isn't a real static file goes to
    # index.html so React Router's client-side routes (e.g. /documents/:id)
    # work on a hard refresh, not just client-side navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
