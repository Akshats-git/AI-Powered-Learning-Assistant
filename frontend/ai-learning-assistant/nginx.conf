server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip the text-based assets Vite emits; images/fonts are already compressed.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The CSP <meta> in index.html can't express frame-ancestors, so anti-framing
    # has to be a real header. "always" + repeated per location, because nginx
    # drops server-level add_header in any location that sets its own.
    set $frame_csp "frame-ancestors 'none'";

    # Long-cache the hashed, content-addressed build assets...
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy $frame_csp always;
    }

    # ...but never cache index.html itself, or a deploy can leave a browser
    # stuck referencing assets that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy $frame_csp always;
    }

    # SPA fallback: any path that isn't a real static file goes to
    # index.html so React Router's client-side routes (e.g. /documents/:id)
    # work on a hard refresh, not just client-side navigation.
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy $frame_csp always;
        try_files $uri $uri/ /index.html;
    }
}
