# Render Blueprint — connect this repo in the Render dashboard via
# "New +" → "Blueprint" and it reads this file to provision the API service.
# Secrets are marked `sync: false` so Render prompts for them once in its
# dashboard instead of storing them in this file / git history.
services:
  - type: web
    name: ai-learning-assistant-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SAME_SITE
        value: none
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: MONTHLY_AI_BUDGET_USD
        sync: false
      - key: ADMIN_EMAILS
        sync: false
